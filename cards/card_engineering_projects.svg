<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="100%" height="100%">
  <defs>
    <style>
      
        * { box-sizing: border-box; }
        
        @keyframes riseUp {
          0% { opacity: 0; transform: translateY(18px); }
          100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes swingIn {
          0% { opacity: 0; transform: translateY(35px) rotate(1.2deg); }
          70% { transform: translateY(-3px) rotate(-0.4deg); }
          100% { opacity: 1; transform: translateY(0) rotate(0); }
        }

        @keyframes printRow {
          0% { opacity: 0; transform: translateY(-2.5px); }
          100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseDot {
          0%, 100% { opacity: 0.9; transform: scale(1); }
          50% { opacity: 0.3; transform: scale(1.6); }
        }

        @keyframes arrowNudge {
          0%, 100% { transform: translateX(0); }
          50% { transform: translateX(5px); }
        }

        @keyframes popSquare {
          0% { opacity: 0; transform: scale(0.2); }
          75% { transform: scale(1.15); }
          100% { opacity: 1; transform: scale(1); }
        }

        @keyframes growBar {
          0% { transform: scaleY(0); }
          100% { transform: scaleY(1); }
        }

        @keyframes popNumber {
          0% { opacity: 0; transform: translateY(6px) scale(0.85); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .rise-up {
          animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .pulse-beacon {
          transform-origin: center;
          animation: pulseDot 2.4s ease-in-out infinite;
        }

        .nudge-arrow {
          animation: arrowNudge 2s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
            animation-delay: 0ms !important;
            transform: none !important;
            opacity: 1 !important;
          }
        }
    
    </style>
  </defs>

  <g class="rise-up" style="animation-delay: 150ms; opacity: 0;">
    <rect x="0" y="0" width="900" height="210" rx="12" fill="#FAF7F2" stroke="#E5DEC9" stroke-width="1.5" />

    <!-- Header -->
    <g transform="translate(36, 32)">
      <text x="0" y="0" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#1E40AF" letter-spacing="1">
        TECHNICAL EXPERTISE // PROTOTYPING &amp; BUILDING SYSTEMS
      </text>
      <text x="0" y="22" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1A1A1A">
        Core Assistive &amp; Electrical Engineering Projects
      </text>
    </g>

    <!-- Left Half: Voice-Controlled Wheelchair Prototype -->
    <g transform="translate(36, 75)">
      <rect x="0" y="0" width="395" height="110" rx="8" fill="#F4EFE6" stroke="#E5DEC9" stroke-width="1" />
      <rect x="0" y="0" width="5" height="110" rx="2" fill="#1E40AF" />

      <text x="24" y="28" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Voice-Controlled Wheelchair Prototype
      </text>
      <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#55504A">
        Assistive mobility device powered by an ESP32 microcontroller.
      </text>
      <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#55504A">
        Engineered logic-power isolation and motor-driver interfacing.
      </text>

      <!-- Tags -->
      <g transform="translate(24, 80)">
        <rect x="0" y="0" width="55" height="18" rx="3" fill="#DBEAFE" />
        <text x="27" y="13" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="9" font-weight="600" fill="#1E40AF" text-anchor="middle">ESP32</text>

        <rect x="62" y="0" width="85" height="18" rx="3" fill="#EFF6FF" />
        <text x="104" y="13" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="9" font-weight="600" fill="#1A1A1A" text-anchor="middle">MOTOR-DRIVER</text>

        <rect x="154" y="0" width="95" height="18" rx="3" fill="#ECFDF5" />
        <text x="201" y="13" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="9" font-weight="600" fill="#047857" text-anchor="middle">ASSISTIVE TECH</text>
      </g>
    </g>

    <!-- Vertical Divider -->
    <line x1="450" y1="75" x2="450" y2="185" stroke="#E5DEC9" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Right Half: Building Electrical Systems (TGA) -->
    <g transform="translate(468, 75)">
      <rect x="0" y="0" width="395" height="110" rx="8" fill="#F4EFE6" stroke="#E5DEC9" stroke-width="1" />
      <rect x="0" y="0" width="5" height="110" rx="2" fill="#D97706" />

      <text x="24" y="28" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1A1A1A">
        Building Electrical Systems (TGA)
      </text>
      <text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#55504A">
        Technical building equipment planning &amp; electrical consulting.
      </text>
      <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#55504A">
        System coordination, AutoCAD electrical schematics &amp; power.
      </text>

      <!-- Tags -->
      <g transform="translate(24, 80)">
        <rect x="0" y="0" width="80" height="18" rx="3" fill="#FEF3C7" />
        <text x="40" y="13" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="9" font-weight="600" fill="#D97706" text-anchor="middle">TGA SYSTEMS</text>

        <rect x="88" y="0" width="65" height="18" rx="3" fill="#EFF6FF" />
        <text x="120" y="13" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="9" font-weight="600" fill="#1E40AF" text-anchor="middle">AUTOCAD</text>

        <rect x="160" y="0" width="95" height="18" rx="3" fill="#F3F4F6" />
        <text x="207" y="13" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="9" font-weight="600" fill="#1A1A1A" text-anchor="middle">POWER PLANNING</text>
      </g>
    </g>
  </g>
</svg>