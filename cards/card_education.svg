<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%">
  <defs>
    <style>
      
        * { box-sizing: border-box; }
        
        @keyframes riseUp {
          0% { opacity: 0; transform: translateY(18px); }
          100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes swingIn {
          0% { opacity: 0; transform: translateY(35px) rotate(1.2deg); }
          70% { transform: translateY(-3px) rotate(-0.4deg); }
          100% { opacity: 1; transform: translateY(0) rotate(0); }
        }

        @keyframes pulseDot {
          0%, 100% { opacity: 0.9; transform: scale(1); }
          50% { opacity: 0.3; transform: scale(1.6); }
        }

        @keyframes arrowNudge {
          0%, 100% { transform: translateX(0); }
          50% { transform: translateX(5px); }
        }

        @keyframes popSquare {
          0% { opacity: 0; transform: scale(0.2); }
          75% { transform: scale(1.15); }
          100% { opacity: 1; transform: scale(1); }
        }

        @keyframes growBar {
          0% { transform: scaleY(0); }
          100% { transform: scaleY(1); }
        }

        @keyframes popNumber {
          0% { opacity: 0; transform: translateY(6px) scale(0.85); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .rise-up {
          animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .pulse-beacon {
          transform-origin: center;
          animation: pulseDot 2.4s ease-in-out infinite;
        }

        .nudge-arrow {
          animation: arrowNudge 2s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
            animation-delay: 0ms !important;
            transform: none !important;
            opacity: 1 !important;
          }
        }
    
    </style>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <g class="rise-up" style="animation-delay: 200ms; opacity: 0;">
    <!-- Card Frame -->
    <rect x="0" y="0" width="440" height="240" rx="10" fill="#FAF7F2" stroke="#E5DEC9" stroke-width="1.5" />
    <path d="M0 10 Q0 0 10 0 L430 0 Q440 0 440 10 L440 5 L0 5 Z" fill="url(#eduGrad)" />

    <!-- Header with Graduation Icon -->
    <g transform="translate(24, 22)">
      <!-- Graduation Icon Badge -->
      <rect x="0" y="0" width="30" height="30" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <text x="7" y="21" font-size="16">🎓</text>

      <text x="40" y="14" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="10" font-weight="700" fill="#1E40AF" letter-spacing="1">ACADEMIC FOUNDATION</text>
      <text x="40" y="28" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1A1A1A">Formal Engineering Education</text>
    </g>

    <line x1="24" y1="64" x2="416" y2="64" stroke="#EFECE6" stroke-width="1" />

    <!-- Timeline Entry 1: Aliah University -->
    <g transform="translate(24, 78)">
      <!-- Node Dot -->
      <circle cx="6" cy="6" r="6" fill="#1E40AF" />
      <circle cx="6" cy="6" r="3" fill="#FFFFFF" />
      <line x1="6" y1="14" x2="6" y2="70" stroke="#DBEAFE" stroke-width="2" />

      <!-- Text Details -->
      <text x="24" y="8" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="10" font-weight="700" fill="#1E40AF">AUG 2024 – PRESENT</text>
      <text x="24" y="25" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#1A1A1A">B.Tech, Electrical Engineering</text>
      <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#55504A">Aliah University, Kolkata</text>
      <text x="24" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8A847C">Embedded Control · Motor Drivers · TGA Systems</text>
    </g>

    <!-- Timeline Entry 2: Al-Ameen Mission -->
    <g transform="translate(24, 156)">
      <!-- Node Dot -->
      <circle cx="6" cy="6" r="6" fill="#059669" />
      <circle cx="6" cy="6" r="3" fill="#FFFFFF" />

      <!-- Text Details -->
      <text x="24" y="8" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="10" font-weight="700" fill="#059669">2018 – 2024</text>
      <text x="24" y="25" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#1A1A1A">Intermediate Science &amp; High School</text>
      <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#55504A">Al-Ameen Mission</text>
      <text x="24" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8A847C">Mathematics · Physics · Chemistry · Foundation</text>
    </g>

    <!-- Status Badge -->
    <rect x="310" y="200" width="106" height="22" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <circle cx="320" cy="211" r="3" fill="#10B981" />
    <text x="330" y="215" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="9" font-weight="600" fill="#047857">IN PROGRESS</text>
  </g>
</svg>