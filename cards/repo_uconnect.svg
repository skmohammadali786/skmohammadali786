<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="100%" height="100%">
  <defs>
    <style>
      
        * { box-sizing: border-box; }
        
        @keyframes riseUp {
          0% { opacity: 0; transform: translateY(18px); }
          100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes swingIn {
          0% { opacity: 0; transform: translateY(35px) rotate(1.2deg); }
          70% { transform: translateY(-3px) rotate(-0.4deg); }
          100% { opacity: 1; transform: translateY(0) rotate(0); }
        }

        @keyframes pulseDot {
          0%, 100% { opacity: 0.9; transform: scale(1); }
          50% { opacity: 0.3; transform: scale(1.6); }
        }

        @keyframes arrowNudge {
          0%, 100% { transform: translateX(0); }
          50% { transform: translateX(5px); }
        }

        @keyframes popSquare {
          0% { opacity: 0; transform: scale(0.2); }
          75% { transform: scale(1.15); }
          100% { opacity: 1; transform: scale(1); }
        }

        @keyframes growBar {
          0% { transform: scaleY(0); }
          100% { transform: scaleY(1); }
        }

        @keyframes popNumber {
          0% { opacity: 0; transform: translateY(6px) scale(0.85); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .rise-up {
          animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .pulse-beacon {
          transform-origin: center;
          animation: pulseDot 2.4s ease-in-out infinite;
        }

        .nudge-arrow {
          animation: arrowNudge 2s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
            animation-delay: 0ms !important;
            transform: none !important;
            opacity: 1 !important;
          }
        }
    
    </style>
  </defs>

  <g class="rise-up" style="animation-delay: 200ms; opacity: 0;">
    <rect x="0" y="0" width="440" height="160" rx="10" fill="#FAF7F2" stroke="#E5DEC9" stroke-width="1.5" />
    <rect x="0" y="0" width="5" height="160" rx="2" fill="#DC2626" />

    <rect x="24" y="22" width="165" height="20" rx="4" fill="#F4EFE6" stroke="#E5DEC9" stroke-width="1" />
    <text x="32" y="36" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="9.5" font-weight="600" fill="#DC2626">FULL-STACK PLATFORM</text>

    <text x="24" y="68" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#1A1A1A">
      UConnect App
    </text>

    <text x="24" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#55504A">
      Real-time campus &amp; community logistics connectivity suite.
    </text>

    <g transform="translate(24, 122)">
      <circle cx="5" cy="5" r="4.5" fill="#3178C6" />
      <text x="16" y="9" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="11" fill="#1A1A1A" font-weight="500">TypeScript · React Native</text>
    </g>

    <g transform="translate(395, 120)" class="nudge-arrow">
      <text x="0" y="10" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#DC2626">→</text>
    </g>
  </g>
</svg>