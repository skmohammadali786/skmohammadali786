  <!-- Block 3: Full-Stack & Platforms -->
  <g transform="translate(42, 195)">
    <rect x="0" y="0" width="415" height="105" rx="8" fill="#F4EFE6" stroke="#E5DEC9" stroke-width="1" />
    <rect x="0" y="0" width="5" height="105" rx="2" fill="#059669" />

    <text x="20" y="24" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="700" fill="#059669" letter-spacing="0.5">03 // SOFTWARE &amp; PLATFORMS</text>
    <text x="20" y="44" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="700" fill="#1A1A1A">Full-Stack &amp; Mobile Ecosystems</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#55504A">TypeScript, Next.js, React Native, Node.js, PostgreSQL, Supabase</text>

    <!-- Colorful Pills -->
    <g transform="translate(20, 74)">
      <rect x="0" y="0" width="70" height="18" rx="3" fill="#DBEAFE" />
      <text x="35" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#1E40AF" text-anchor="middle">TYPESCRIPT</text>

      <rect x="76" y="0" width="60" height="18" rx="3" fill="#F3F4F6" />
      <text x="106" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#1A1A1A" text-anchor="middle">NEXT.JS</text>

      <rect x="142" y="0" width="76" height="18" rx="3" fill="#E0F2FE" />
      <text x="180" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#0284C7" text-anchor="middle">REACT NATIVE</text>

      <rect x="224" y="0" width="68" height="18" rx="3" fill="#ECFDF5" />
      <text x="258" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">SUPABASE</text>
    </g>
  </g>

  <!-- Block 4: Leadership, Projects & Languages -->
  <g transform="translate(483, 195)">
    <rect x="0" y="0" width="415" height="105" rx="8" fill="#F4EFE6" stroke="#E5DEC9" stroke-width="1" />
    <rect x="0" y="0" width="5" height="105" rx="2" fill="#7C3AED" />

    <text x="20" y="24" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="10.5" font-weight="700" fill="#7C3AED" letter-spacing="0.5">04 // COORDINATION &amp; LANGUAGES</text>
    <text x="20" y="44" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="16.5" font-weight="700" fill="#1A1A1A">Project Leadership &amp; Communication</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#55504A">Student Leadership, Milestone Planning, Event Coordination</text>

    <!-- Colorful Pills -->
    <g transform="translate(20, 74)">
      <rect x="0" y="0" width="70" height="18" rx="3" fill="#F3E8FF" />
      <text x="35" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#7C3AED" text-anchor="middle">LEADERSHIP</text>

      <rect x="76" y="0" width="80" height="18" rx="3" fill="#EFF6FF" />
      <text x="116" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#1E40AF" text-anchor="middle">PLANNING</text>

      <rect x="162" y="0" width="70" height="18" rx="3" fill="#ECFDF5" />
      <text x="197" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#047857" text-anchor="middle">GERMAN (B1)</text>

      <rect x="238" y="0" width="80" height="18" rx="3" fill="#FEF3C7" />
      <text x="278" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#D97706" text-anchor="middle">EN · BN · HI</text>
    </g>
  </g>
</svg>