      <text x="39" y="12.5" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="8.5" font-weight="600" fill="#D97706" text-anchor="middle">TGA SYSTEMS</text>

      <rect x="84" y="0" width="60" height="18" rx="3" fill="#EFF6FF" />
