<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" width="100%" height="100%">
  <defs>
    <style>
      
        * { box-sizing: border-box; }
        
        @keyframes riseUp {
          0% { opacity: 0; transform: translateY(18px); }
          100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes swingIn {
          0% { opacity: 0; transform: translateY(35px) rotate(1.2deg); }
          70% { transform: translateY(-3px) rotate(-0.4deg); }
          100% { opacity: 1; transform: translateY(0) rotate(0); }
        }

        @keyframes printRow {
          0% { opacity: 0; transform: translateY(-3px); }
          100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseDot {
          0%, 100% { opacity: 0.9; transform: scale(1); }
          50% { opacity: 0.3; transform: scale(1.6); }
        }

        @keyframes arrowNudge {
          0%, 100% { transform: translateX(0); }
          50% { transform: translateX(5px); }
        }

        @keyframes popSquare {
          0% { opacity: 0; transform: scale(0.2); }
          75% { transform: scale(1.15); }
          100% { opacity: 1; transform: scale(1); }
        }

        @keyframes growBar {
          0% { transform: scaleY(0); }
          100% { transform: scaleY(1); }
        }

        @keyframes popNumber {
          0% { opacity: 0; transform: translateY(6px) scale(0.85); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .rise-up {
          animation: riseUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .pulse-beacon {
          transform-origin: center;
          animation: pulseDot 2.4s ease-in-out infinite;
        }

        .nudge-arrow {
          animation: arrowNudge 2s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
            animation-delay: 0ms !important;
            transform: none !important;
            opacity: 1 !important;
          }
        }
    
    </style>
    <linearGradient id="tileShine_innovation" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#D97706" />
      <animateTransform attributeName='gradientTransform' type='translate' from='-300,0' to='400,0' dur='4s' repeatCount='indefinite' />
    </linearGradient>
  </defs>

  <g style="animation: swingIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 500ms forwards; opacity: 0;">
    <!-- Background Card -->
    <rect x="0" y="0" width="300" height="190" rx="10" fill="#FAF7F2" stroke="#E5DEC9" stroke-width="1.5" />
    
    <!-- Top Accent Stripe -->
    <path d="M0 10 Q0 0 10 0 L290 0 Q300 0 300 10 L300 6 L0 6 Z" fill="#D97706" />

    <!-- Corner Beacon -->
    <circle cx="276" cy="28" r="4" fill="#D97706" />
    <circle cx="276" cy="28" r="4" fill="#D97706" class="pulse-beacon" />

    <!-- Category Header -->
    <text x="24" y="34" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#D97706" letter-spacing="1">
      03 / SYSTEMS &amp; TGA
    </text>

    <!-- Main Title in Serif -->
    <text x="24" y="78" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1A1A1A" letter-spacing="-0.3">
      INNOVATION
    </text>

    <!-- Big Metric Number -->
    <text x="24" y="116" font-family="'Instrument Serif', 'Newsreader', Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="url(#tileShine_innovation)">
      PROJECT COORD
    </text>

    <!-- Description / Tech Subtitle -->
    <text x="24" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#55504A">
      Building Electrical (TGA) · Control · Documentation
    </text>

    <!-- Link / Action Arrow Footer -->
    <line x1="24" y1="162" x2="276" y2="162" stroke="#EFECE6" stroke-width="1" />
    <text x="24" y="178" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="10.5" fill="#8A847C">EXPLORE ARCHIVE</text>
    <g transform="translate(262, 170)" class="nudge-arrow">
      <text x="0" y="8" font-family="'Geist Mono', 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#D97706">→</text>
    </g>
  </g>
</svg>